# Serves the built dashboard and forwards /api to the backend.
# The container uses host networking, so the backend is reachable on 127.0.0.1:8000,
# the same address as in development.
server {
    listen 127.0.0.1:5173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # API calls are proxied to the backend, so the browser only sees one origin.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
